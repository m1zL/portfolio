name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # ブログ欄の記事一覧はビルド時に Zenn の RSS から取得しているため、
  # 新しい記事を公開しても再ビルドしない限りサイトに反映されない。
  # 毎日1回定期的に作り直し、公開から1日以内に反映されるようにする。
  # 時刻は日本時間の早朝 06:17（UTC 21:17）。アクセスの少ない時間帯で、
  # 朝にはその前日に公開した記事が反映されている。毎時0分は GitHub Actions の
  # schedule が混み合って遅延・欠落しやすいので、半端な分にずらしている。
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
